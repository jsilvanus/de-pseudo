name: Update npm lockfile

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: 'Commit the generated package-lock.json to the repository'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Show lockfile status
        run: git diff -- package-lock.json

      - name: Commit updated lockfile
        if: inputs.commit_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json is already up to date.'
          else
            git commit -m 'chore: update npm lockfile'
            git push
          fi
